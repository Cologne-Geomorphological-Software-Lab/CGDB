name: demo image

# Builds the Docker demo, starts it and runs docker/smoke_test.sh, including
# a restart that must not duplicate the demo data. On release tags the tested
# image is published to GHCR (amd64 only until arm64 has been tested).

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.demo.yml
      - docker/**
      - prototype/demo_data.py
      - prototype/management/commands/load_demo_data.py
      - pyproject.toml
      - uv.lock
      - frontend/**
      - .github/workflows/demo-image.yml
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cologne-geomorphological-software-lab/cgdb-demo

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the demo
        run: docker compose -f compose.demo.yml up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: bash docker/smoke_test.sh

      - name: Restart without duplicating data
        run: |
          docker compose -f compose.demo.yml restart web
          docker compose -f compose.demo.yml up -d --wait --wait-timeout 300
          docker compose -f compose.demo.yml logs web | grep -q "Demo data already present"
          bash docker/smoke_test.sh

      - name: Logs
        if: failure()
        run: docker compose -f compose.demo.yml logs

      - name: Clean up
        if: always()
        run: docker compose -f compose.demo.yml down -v

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
