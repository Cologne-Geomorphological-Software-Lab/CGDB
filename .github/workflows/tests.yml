name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: Write throwaway local_settings.py
        # Gitignored, never committed — mypy's django-stubs plugin loads
        # prototype.test_settings, which chains through prototype.settings,
        # which requires a local_settings.py to exist (SECRET_KEY etc.).
        # test_settings.py overrides SECRET_KEY/DEBUG itself; these values
        # only need to satisfy settings.py's own load-time checks.
        run: |
          echo 'SECRET_KEY = "ci-test-key-not-for-production"' > prototype/local_settings.py
          echo 'DEBUG = True' >> prototype/local_settings.py
      - name: mypy
        run: uv run mypy .
      # basedpyright is intentionally not run here yet: unlike mypy/ruff, it
      # has never been run repo-wide before (pre-commit's own basedpyright
      # hook only checks field_data/admin.py + field_data/models.py) and
      # reports 348 pre-existing errors across 41 files when run at full
      # scope. Fixing that is its own dedicated pass (see TECH_DEBT_AUDIT.md
      # X7) - add it here once that's done, not before.

  spatialite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install system packages (GDAL, SpatiaLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libsqlite3-mod-spatialite
      - name: Install dependencies
        run: uv sync
      - name: Write throwaway local_settings.py
        # Gitignored, never committed — prototype.test_settings chains
        # through prototype.settings, which requires a local_settings.py to
        # exist. test_settings.py overrides SECRET_KEY/DEBUG/DATABASES
        # itself; these values only need to satisfy settings.py's own
        # load-time checks.
        run: |
          echo 'SECRET_KEY = "ci-test-key-not-for-production"' > prototype/local_settings.py
          echo 'DEBUG = True' >> prototype/local_settings.py
      - name: Run test suite (SpatiaLite)
        run: uv run pytest -m "not postgis_only" --cov=. --cov-report=term-missing

  postgis:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cgdb_test
          POSTGRES_USER: cgdb
          POSTGRES_PASSWORD: cgdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cgdb -d cgdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Install system packages (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin
      - name: Install dependencies
        run: uv sync
      - name: Write throwaway local_settings.py
        # Gitignored, never committed — prototype.test_settings_postgis
        # chains through prototype.test_settings and prototype.settings,
        # which requires a local_settings.py to exist. Downstream settings
        # modules override SECRET_KEY/DEBUG/DATABASES themselves; these
        # values only need to satisfy settings.py's own load-time checks.
        run: |
          echo 'SECRET_KEY = "ci-test-key-not-for-production"' > prototype/local_settings.py
          echo 'DEBUG = True' >> prototype/local_settings.py
      - name: Run GIS-marked tests against PostGIS
        env:
          DJANGO_SETTINGS_MODULE: prototype.test_settings_postgis
        run: uv run pytest -m "gis or postgis_only"
