name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  spatialite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install system packages (GDAL, SpatiaLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin libsqlite3-mod-spatialite
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite (SpatiaLite)
        run: pytest -m "not postgis_only"

  postgis:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cgdb_test
          POSTGRES_USER: cgdb
          POSTGRES_PASSWORD: cgdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cgdb -d cgdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Install system packages (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libproj-dev gdal-bin
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run GIS-marked tests against PostGIS
        env:
          DJANGO_SETTINGS_MODULE: prototype.test_settings_postgis
        run: pytest -m "gis or postgis_only"
