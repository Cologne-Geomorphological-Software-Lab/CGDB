[pytest]
DJANGO_SETTINGS_MODULE = prototype.test_settings
python_files = tests.py test_*.py
markers =
    gis: GIS-specific SQL (raw queries, vendor ORM functions) expected to behave identically on both backends — run against both prototype.test_settings (SpatiaLite) and prototype.test_settings_postgis (PostGIS) to catch divergence.
    postgis_only: uses PostGIS-only functionality (e.g. ST_AsMVT vector tiles) with no SpatiaLite equivalent — only ever run against prototype.test_settings_postgis, excluded from the default SpatiaLite suite entirely.
