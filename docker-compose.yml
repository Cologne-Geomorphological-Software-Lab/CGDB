services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cgdb_test
      POSTGRES_USER: cgdb
      POSTGRES_PASSWORD: cgdb
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgdb -d cgdb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgis_data:
