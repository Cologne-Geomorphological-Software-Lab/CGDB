# Dagster configuration
# Configuration inherits from Django settings

# Run storage: SQLite by default — CGDB runs a single daemon process with
# jobs triggered only manually (no scheduler, no multi-worker setup), which
# is exactly the scenario Dagster's own docs consider SQLite storage safe
# for. base_dir must be an absolute path — Dagster resolves it relative to
# the *calling process's* cwd, not to DAGSTER_HOME (a plain "storage" here
# previously broke when launched from the Django admin, whose subprocess
# inherits Apache's cwd rather than the project root). {env: DAGSTER_HOME}
# pins it to the one env var every launch path already sets. For
# higher-throughput deployments (multiple concurrent workers, scheduled
# runs), switch to PostgreSQL: comment out the sqlite block below,
# uncomment the postgres block, and set the four DAGSTER_PG_* environment
# variables (see README.md).
storage:
  sqlite:
    base_dir:
      env: DAGSTER_HOME
#  postgres:
#    postgres_db:
#      username: { env: DAGSTER_PG_USER }
#      password: { env: DAGSTER_PG_PASSWORD }
#      hostname: { env: DAGSTER_PG_HOST }
#      db_name: { env: DAGSTER_PG_DB }
#      port: 5432

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

# Runs submitted via `dagster job launch` are launched directly by
# DefaultRunLauncher. QueuedRunCoordinator (concurrency-limited queueing) is
# only needed once runs can be submitted concurrently from multiple workers —
# switch it on alongside PostgreSQL storage if that becomes necessary.

telemetry:
  enabled: false
