repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: python
        additional_dependencies: [ruff==0.15.20]  # pin to match .venv/pyproject.toml — an unpinned hook silently picks up new ruff releases (and any new rules they enable under select = ["ALL"]), independent of what the project actually uses
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: python
        additional_dependencies: [ruff==0.15.20]  # pin to match .venv/pyproject.toml — an unpinned hook silently picks up new ruff releases (and any new rules they enable under select = ["ALL"]), independent of what the project actually uses
        types: [python]

      - id: mypy
        name: mypy
        entry: scripts/run-mypy.cmd
        language: script
        pass_filenames: false

      - id: basedpyright
        name: basedpyright
        entry: scripts/run-basedpyright.cmd
        language: script
        pass_filenames: false

      - id: bandit
        name: bandit (security)
        entry: scripts/run-bandit.cmd
        language: script
        pass_filenames: false

      - id: vulture
        name: vulture (dead code)
        entry: scripts/run-vulture.cmd
        language: script
        pass_filenames: false

      - id: xenon
        name: xenon (complexity gate)
        entry: scripts/run-xenon.cmd
        language: script
        pass_filenames: false

      - id: pylint-duplicate-code
        name: pylint (duplicate code)
        entry: scripts/run-pylint-duplicate.cmd
        language: script
        pass_filenames: false
